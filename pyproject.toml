[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-task-manager"
version = "0.1.0"
description = "Shared observation tasks and short-lived notification buffers for Repowire"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codex-task-manager = "codex_task_manager.cli:main"
ctm = "codex_task_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
